<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPStudy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="auth-screen" id="authScreen">
      <section class="auth-card">

        <h1>단어장</h1>
        <p class="sub">개인 일본어 단어장</p>

        <div class="auth-form">
          <label>
            <span>이메일</span>
            <input
              id="authEmail"
              type="email"
              placeholder="example@email.com"
              autocomplete="email"
            />
          </label>

          <label>
            <span>비밀번호</span>
            <input
              id="authPassword"
              type="password"
              placeholder="6자 이상 입력"
              autocomplete="current-password"
            />
          </label>

          <button id="signInButton" type="button" class="secondary-button">
            로그인
          </button>

          <button id="signUpButton" type="button" class="primary-button">
            회원가입
          </button>

        
        </div>

        <p id="authStatus" class="auth-status"></p>
      </section>
    </main>

    <main class="app-shell" id="appShell" hidden>
      <header class="app-header">
        <div>
          <div class="eyebrow">日本語単語帳</div>
          <h1>일본어 단어장</h1>
        </div>

        <div class="user-card">
          <span id="userEmail"></span>
          <button id="signOutButton" type="button" class="secondary-button small">
            로그아웃
          </button>
        </div>
      </header>

      <section class="study-panel" id="dashboardPanel">
        <div class="dashboard-actions">
          <button id="continueButton" type="button" class="primary-button">
            이어하기
          </button>
          <button id="showNewStudyButton" type="button" class="secondary-button">
            새로 시작하기
          </button>
        </div>

        <div id="levelStats" class="level-stats"></div>

        <div class="new-study-form" id="newStudyForm" hidden>
          <div class="controls">
            <label for="levelSelect">
              <span>레벨 선택</span>
              <select id="levelSelect">
                <option value="N5">N5</option>
                <option value="N4">N4</option>
                <option value="N3">N3</option>
                <option value="N2">N2</option>
                <option value="N1">N1</option>
              </select>
            </label>

            <label for="wordCountInput">
              <span>단어 수</span>
              <input
                id="wordCountInput"
                type="number"
                min="1"
                max="100"
                step="1"
                value="20"
                inputmode="numeric"
              />
            </label>

            <button id="createSessionButton" type="button" class="primary-button">
              시작
            </button>
          </div>
        </div>

        <div class="dashboard-footer">
          <p id="status" class="status"></p>
        </div>
      </section>

      <section class="history-panel" id="historyPanel">
        <div class="section-heading">
          <div>
            <h2>학습 기록</h2>
          </div>
        </div>

        <ul id="sessionList" class="session-list"></ul>
      </section>

      <section class="session-panel" id="sessionPanel" hidden>
        <div>
          <div class="eyebrow">Study Session</div>
          <h2 id="sessionTitle">학습 단어</h2>
        </div>

        <button id="backToDashboardButton" type="button" class="secondary-button small">
          목록으로
        </button>
      </section>

      <section class="card-study" id="cardStudy" hidden>
        <p id="cardProgress" class="card-progress"></p>

        <article id="wordCard" class="word-card"></article>

        <div class="card-controls">
          <button id="prevCardButton" type="button" class="secondary-button">
            이전
          </button>
          <button id="nextCardButton" type="button" class="primary-button">
            다음
          </button>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
